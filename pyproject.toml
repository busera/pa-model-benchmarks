[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-model-benchmarks"
version = "0.1.0"
description = "Governed PA and coding model benchmark suites"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-ra"
cache_dir = "/tmp/pa-model-benchmarks-pytest-cache"
