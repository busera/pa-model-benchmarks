name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: python -m pytest -q

      - name: Run self-tests
        run: |
          python scripts/pa_daily_use_benchmark.py --self-test
          python scripts/pa_real_life_pack_benchmark.py --self-test
          python scripts/pa_typical_workload_benchmark.py --self-test
          python scripts/pa_conflict_retrieval_benchmark.py --self-test
          python scripts/pa_held_out_benchmark.py --self-test
          python scripts/run_t01_t12_full_matrix_profiled.py --self-test
          python scripts/mb006_candidate_runner.py --self-test

      - name: Run preflight (no model calls)
        run: python scripts/mb006_preflight.py --json